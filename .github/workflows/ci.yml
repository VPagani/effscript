name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commit messages follow CONTRIBUTING.md
        run: scripts/check-commit-msg.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install JavaScript dependencies (enables the end-to-end type-check tests)
        run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: EffScript sources are formatted and lint-clean
        run: |
          cargo run -q -p efs_cli -- fmt --check examples tests/fixtures packages/bundler-tests/src website/src
          cargo run -q -p efs_cli -- lint --deny-warnings examples tests/fixtures packages/bundler-tests/src website/src
      - name: Type check the examples, with Effect Language Service diagnostics
        run: cargo run -q -p efs_cli -- check --effect examples
      - name: Build with every bundler plugin and run the output
        run: pnpm test:bundlers
      - name: Type check and build the website
        run: |
          cargo run -q -p efs_cli -- check website
          pnpm --filter @effscript/website build
