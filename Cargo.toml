[workspace]
resolver = "3"
members = ["crates/efs_syntax", "crates/efs_codegen", "crates/efs_check", "crates/efs_fmt", "crates/efs_lint"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/VPagani/effscript"

[workspace.dependencies]
efs_syntax = { path = "crates/efs_syntax" }
efs_codegen = { path = "crates/efs_codegen" }
efs_fmt = { path = "crates/efs_fmt" }
efs_lint = { path = "crates/efs_lint" }
efs_check = { path = "crates/efs_check" }
efs_lsp = { path = "crates/efs_lsp" }
efs_mapper = { path = "crates/efs_mapper" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-server = "0.7"
lsp-types = "0.97"
clap = { version = "4", features = ["derive"] }

tsrs_ast = "=7.1.0-beta.tsrs5"
tsrs_astnav = "=7.1.0-beta.tsrs5"
tsrs_checker = "=7.1.0-beta.tsrs5"
tsrs_compiler = "=7.1.0-beta.tsrs5"
tsrs_core = "=7.1.0-beta.tsrs5"
tsrs_diagnostics = "=7.1.0-beta.tsrs5"
tsrs_tsoptions = "=7.1.0-beta.tsrs5"
tsrs_vfs = "=7.1.0-beta.tsrs5"

[profile.release]
lto = "thin"
codegen-units = 16
